<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiriusXM Desktop Widget</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    /* Default Theme Variables (Overridden by data-theme on body) */
    :root,
    body[data-theme="christmas"] {
      --bg-shell: linear-gradient(145deg, rgba(16, 38, 28, 0.97) 0%, rgba(18, 12, 16, 0.99) 100%);
      --bg-drawer: rgba(11, 22, 17, 0.97);

    body[data-theme="hearth"] {

    body[data-theme="nyquil"] {
      --bg-shell: linear-gradient(145deg, rgba(5, 46, 36, 0.97) 0%, rgba(2, 22, 18, 0.99) 100%);

      --accent-secondary: #059669;

    body[data-theme="thanksgiving"] {
      --bg-shell: linear-gradient(145deg, rgba(46, 20, 14, 0.97) 0%, rgba(24, 11, 8, 0.99) 100%);

      --bg-card: rgba(234, 88, 12, 0.08);
      --bg-card-hover: rgba(234, 88, 12, 0.16);
      --border-glass: rgba(245, 158, 11, 0.42);
      --accent: #ea580c;
      --accent-secondary: #dc2626;
      --accent-glow: rgba(234, 88, 12, 0.48);
      --play-btn-grad: linear-gradient(135deg, #f97316 0%, #b91c1c 100%);
      --play-btn-shadow: rgba(234, 88, 12, 0.5);
      --badge-bg: rgba(234, 88, 12, 0.22);
      --badge-border: rgba(251, 146, 60, 0.48);
      --badge-text: #fdba74;
      --text-primary: #fff7ed;
      --text-secondary: #fed7aa;
      --text-muted: #fb923c;
      --fav-gold: #fbbf24;
      --live-green: #34d399;
      --show-snow: 1;

    }

    body[data-theme="pumpkin"] {
      --bg-shell: linear-gradient(145deg, rgba(54, 27, 13, 0.97) 0%, rgba(27, 14, 7, 0.99) 100%);
      --bg-drawer: rgba(29, 15, 7, 0.98);
      --bg-card: rgba(249, 115, 22, 0.08);
      --bg-card-hover: rgba(249, 115, 22, 0.16);
      --border-glass: rgba(251, 146, 60, 0.4);
      --accent: #f97316;
      --accent-secondary: #d97706;
      --accent-glow: rgba(249, 115, 22, 0.45);
      --play-btn-grad: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
      --play-btn-shadow: rgba(249, 115, 22, 0.48);
      --badge-bg: rgba(249, 115, 22, 0.2);
      --badge-border: rgba(251, 146, 60, 0.45);
      --badge-text: #fed7aa;
      --text-primary: #fff7ed;
      --text-secondary: #ffedd5;
      --text-muted: #fb923c;
      --fav-gold: #fde047;
      --live-green: #34d399;
      --show-snow: 1;
      --show-lights: 0;
    }

    body[data-theme="autumn"] {
      --bg-shell: linear-gradient(145deg, rgba(36, 26, 16, 0.97) 0%, rgba(19, 15, 10, 0.99) 100%);
      --bg-drawer: rgba(20, 15, 10, 0.98);
      --bg-card: rgba(217, 119, 6, 0.08);
      --bg-card-hover: rgba(217, 119, 6, 0.16);
      --border-glass: rgba(217, 119, 6, 0.38);
      --accent: #d97706;
      --accent-secondary: #65a30d;
      --accent-glow: rgba(217, 119, 6, 0.42);
      --play-btn-grad: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      --play-btn-shadow: rgba(217, 119, 6, 0.48);
      --badge-bg: rgba(101, 163, 13, 0.22);
      --badge-border: rgba(132, 204, 22, 0.45);
      --badge-text: #bef264;
      --text-primary: #fefce8;
      --text-secondary: #fde68a;
      --text-muted: #ca8a04;
      --fav-gold: #fbbf24;
      --live-green: #84cc16;
      --show-snow: 1;
      --show-lights: 0;
    }

    body[data-theme="adaptive"] {
      --bg-shell: linear-gradient(145deg, rgba(20, 26, 40, 0.97) 0%, rgba(10, 13, 21, 0.99) 100%);
      --bg-drawer: rgba(10, 13, 21, 0.98);
      --bg-card: rgba(0, 210, 255, 0.08);
      --bg-card-hover: rgba(0, 210, 255, 0.16);
      --border-glass: rgba(0, 210, 255, 0.38);
      --accent: #00d2ff;
      --accent-secondary: #0072ff;
      --accent-glow: rgba(0, 210, 255, 0.42);
      --play-btn-grad: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
      --play-btn-shadow: rgba(0, 210, 255, 0.46);
      --badge-bg: rgba(0, 210, 255, 0.18);
      --badge-border: rgba(0, 210, 255, 0.42);
      --badge-text: #7dd3fc;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --fav-gold: #fbbf24;
      --live-green: #34d399;
      --show-snow: 0;
      --show-lights: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-primary);
    }

    .widget-shell {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-shell);
      border: 2px solid var(--border-glass);
      border-radius: 22px;
      overflow: hidden;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    /* Snowfall Canvas Overlay */
    #snowCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: var(--show-snow, 1);
      transition: opacity 0.4s ease;
    }

    /* Festive Christmas String Lights along Top Bar */
    .christmas-lights {
      position: absolute;
      top: 38px;
      left: 0;
      right: 0;
      height: 12px;
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      pointer-events: none;
      z-index: 5;
      opacity: var(--show-lights, 1);
      transition: opacity 0.4s ease;
      padding: 0 14px;
    }

    .light-bulb {
      width: 8px;
      height: 10px;
      border-radius: 50% 50% 60% 60%;
      animation: twinkle 1.8s infinite alternate ease-in-out;
      transition: filter 80ms linear, transform 80ms ease-out, opacity 80ms linear;
    }

    .light-bulb:nth-child(4n+1) {
      background: #ff3b30;
      box-shadow: 0 0 10px #ff3b30, 0 0 18px #ff3b30;
      animation-delay: 0s;
    }
    .light-bulb:nth-child(4n+2) {
      background: #34c759;
      box-shadow: 0 0 10px #34c759, 0 0 18px #34c759;
      animation-delay: 0.45s;
    }
    .light-bulb:nth-child(4n+3) {
      background: #ffcc00;
      box-shadow: 0 0 10px #ffcc00, 0 0 18px #ffcc00;
      animation-delay: 0.9s;
    }
    .light-bulb:nth-child(4n+4) {
      background: #00d2ff;
      box-shadow: 0 0 10px #00d2ff, 0 0 18px #00d2ff;
      animation-delay: 1.35s;
    }

    @keyframes twinkle {
      0% { opacity: 0.45; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    body.music-reactive[data-theme="christmas"] .christmas-lights .light-bulb {
      animation: none;
      /* Keep a steady baseline; music can only make lights brighter. */
      filter: brightness(calc(1 + var(--music-level, 0) * 1.15));
      opacity: 1;
      transform: scale(calc(1 + var(--music-level, 0) * 0.18));
    }

    body.music-reactive[data-theme="christmas"].music-hit .christmas-lights .light-bulb {
      filter: brightness(2.2) saturate(1.35);
      transform: scale(1.32);
    }

    /* Ambient Glow behind Artwork */
    .ambient-glow {
      position: absolute;
      top: -40px;
      left: -30px;
      width: 320px;
      height: 260px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      filter: blur(32px);
      pointer-events: none;
      z-index: 0;
      transition: background 0.6s ease;
    }

    /* Top utility strip & Native Chromium OS Drag region (40px) */
    .top-bar {
      position: relative;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      padding: 0 18px;
      background: rgba(0, 0, 0, 0.22);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      -webkit-app-region: drag;
      flex-shrink: 0;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-secondary);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      height: 100%;
    }

    #statusText {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--text-muted);
      transition: all 0.3s ease;
    }

    .status-dot.playing {
      background: var(--live-green);
      box-shadow: 0 0 12px var(--live-green);
    }

    .status-dot.auth-needed {
      background: var(--fav-gold);
      box-shadow: 0 0 12px var(--fav-gold);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .go-live-pill {
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #34d399;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      -webkit-app-region: no-drag;
      margin-right: 4px;
    }

    .go-live-pill:hover {
      background: rgba(16, 185, 129, 0.32);
      border-color: #10b981;
      color: #fff;
      transform: translateY(-1px);
    }

    .mini-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: var(--text-secondary);
      width: 30px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 14px;
      -webkit-app-region: no-drag;
    }

    .mini-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .mini-btn.active {
      color: var(--fav-gold);
      border-color: rgba(251, 191, 36, 0.45);
      background: rgba(251, 191, 36, 0.12);
    }

    .mini-btn.close-btn:hover {
      background: rgba(239, 68, 68, 0.3);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    /* Theme Picker Popover Bar */
    .theme-popover {
      position: absolute;
      top: 44px;
      left: 16px;
      right: 16px;
      z-index: 50;
      background: rgba(12, 16, 24, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      padding: 12px 16px;
      max-height: calc(100% - 48px);
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(16px);
      -webkit-app-region: no-drag;
    }

    .theme-popover * {
      -webkit-app-region: no-drag;
    }

    .theme-popover.open {
      display: flex;
    }

    .theme-popover-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
    }

    .theme-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .visual-settings {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px 12px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
    }

    .visual-settings label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .opacity-slider {
      width: 150px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .reactive-toggle {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .theme-chip {
      flex: 1;
      justify-content: center;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-app-region: no-drag;
      white-space: nowrap;
    }

    .theme-chip:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }

    .theme-chip.active {
      border-color: var(--fav-gold);
      background: rgba(251, 191, 36, 0.18);
      color: #fff;
    }

    .popover-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 2px 0;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 2px 2px 0 2px;
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .size-pills {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 2px;
    }

    .size-pill {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .size-pill:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.1);
    }

    .size-pill.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .setting-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .toggle-switch {
      position: relative;
      width: 38px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.18);
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0;
      flex-shrink: 0;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s ease;
    }

    .toggle-switch.on {
      background: var(--live-green);
      border-color: var(--live-green);
    }

    .toggle-switch.on::after {
      transform: translateX(18px);
    }

    /* Track History Popover */
    .history-popover {
      position: absolute;
      top: 44px;
      left: 16px;
      right: 16px;
      z-index: 50;
      background: rgba(12, 16, 24, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      padding: 10px 14px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(16px);
      -webkit-app-region: no-drag;
    }

    .history-popover * {
      -webkit-app-region: no-drag;
    }

    .history-popover.open {
      display: flex;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-clear-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .history-clear-btn:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 104px;
      overflow-y: auto;
      padding-right: 2px;
    }

    body.drawer-open .history-list {
      max-height: 360px;
    }

    .history-list::-webkit-scrollbar {
      width: 5px;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
    }

    .history-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .history-row:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    .history-info {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: baseline;
      gap: 7px;
      white-space: nowrap;
      overflow: hidden;
    }

    .history-ch {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 5px;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--badge-border);
      flex-shrink: 0;
    }

    .history-track {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-artist {
      font-size: 11.5px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 1;
    }

    .history-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .history-time {
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .history-copy-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .history-copy-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .history-empty {
      font-size: 12.5px;
      color: var(--text-secondary);
      text-align: center;
      padding: 14px 8px;
    }

    /* Main Player Deck (156px height) */
    .player-deck {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 156px;
      padding: 0 22px;
      gap: 20px;
      flex-shrink: 0;
    }

    /* Channel Logo / Album Art (114x114px) */
    .art-wrapper {
      position: relative;
      width: 114px;
      height: 114px;
      border-radius: 20px;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .art-wrapper:hover {
      transform: scale(1.03);
      border-color: var(--fav-gold);
    }

    .art-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .art-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      text-align: center;
      padding: 8px;
    }

    .art-ch-num {
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
      color: #fff;
      text-shadow: 0 3px 10px rgba(0,0,0,0.45);
    }

    .art-ch-label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.85);
      margin-top: 4px;
    }

    /* Equalizer Overlay when Playing */
    .eq-bars {
      position: absolute;
      bottom: 8px;
      right: 8px;
      display: none;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
      padding: 3px 5px;
      background: rgba(0, 0, 0, 0.72);
      border-radius: 6px;
    }

    .eq-bars.active {
      display: flex;
    }

    .eq-bar {
      width: 3.5px;
      background: var(--fav-gold);
      border-radius: 2px;
      animation: eqBounce 0.8s infinite ease-in-out alternate;
    }

    .eq-bar:nth-child(1) { height: 6px; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { height: 14px; animation-delay: 0.3s; }
    .eq-bar:nth-child(3) { height: 9px; animation-delay: 0.2s; }

    @keyframes eqBounce {
      0% { height: 4px; }
      100% { height: 14px; }
    }

    /* Track & Channel Info (Draggable except for star button) */
    .now-playing {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .channel-row {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      max-width: 100%;
    }

    .ch-badge {
      font-size: 13px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 7px;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--badge-border);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ch-name {
      display: block;
      flex: 0 1 auto;
      min-width: 0;
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-star-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 0 4px;
      flex-shrink: 0;
      transition: transform 0.15s ease, color 0.15s ease;
      -webkit-app-region: no-drag;
    }

    .fav-star-btn:hover {
      transform: scale(1.22);
      color: var(--fav-gold);
    }

    .fav-star-btn.favorited {
      color: var(--fav-gold);
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }

    .track-title-row {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      max-width: 100%;
    }

    .mini-ch-pill {
      display: none;
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--badge-border);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .track-title {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 23px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .track-artist {
      min-width: 0;
      width: 100%;
      font-size: 16.5px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Car-Radio Style Scrolling Marquee */
    .marquee-host {
      position: relative;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .marquee-host.is-marquee {
      text-overflow: clip;
      margin-left: -6px;
      padding-left: 6px;
      padding-right: 12px;
      -webkit-mask-image: linear-gradient(to right, transparent 0px, #000 6px, #000 calc(100% - 14px), transparent 100%);
      mask-image: linear-gradient(to right, transparent 0px, #000 6px, #000 calc(100% - 14px), transparent 100%);
    }

    .marquee-track {
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
      will-change: transform;
    }

    .marquee-gap {
      display: inline-block;
      width: 48px;
      flex-shrink: 0;
    }

    /* Controls Column (Transport + Volume) */
    .controls-column {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    /* Transport Controls */
    .controls-cluster {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    /* Volume Bar */
    .volume-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 4px 10px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: background 0.2s ease, border-color 0.2s ease;
      -webkit-app-region: no-drag;
    }

    .volume-bar:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-glass);
    }

    .mute-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .mute-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .mute-btn.muted {
      color: #f87171;
    }

    .mute-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      min-width: 0;
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: var(--badge-bg);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--text-primary);
      border: 2px solid var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.18);
    }

    .volume-pct {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-secondary);
      min-width: 32px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .mini-only-actions {
      display: none;
      align-items: center;
      gap: 5px;
      margin-left: 2px;
      -webkit-app-region: no-drag;
    }

    /* Mini Bar Mode Overrides */
    body.mini-mode .widget-shell {
      border-radius: 16px;
    }

    body.mini-mode .top-bar,
    body.mini-mode .christmas-lights,
    body.mini-mode .channel-drawer,
    body.mini-mode .theme-popover,
    body.mini-mode .history-popover {
      display: none !important;
    }

    body.mini-mode .player-deck {
      height: 68px;
      padding: 0 14px;
      gap: 12px;
      -webkit-app-region: drag;
    }

    body.mini-mode .art-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      border-width: 1.5px;
    }

    body.mini-mode .art-ch-num {
      font-size: 16px;
    }

    body.mini-mode .art-ch-label {
      display: none;
    }

    body.mini-mode .eq-bars {
      bottom: 3px;
      right: 3px;
      height: 12px;
      padding: 2px 3px;
      gap: 2px;
    }

    body.mini-mode .eq-bar {
      width: 2.5px;
    }

    body.mini-mode .now-playing {
      gap: 2px;
    }

    body.mini-mode .channel-row {
      display: none;
    }

    body.mini-mode .mini-ch-pill {
      display: inline-block;
    }

    body.mini-mode .track-title {
      font-size: 15px;
    }

    body.mini-mode .track-artist {
      font-size: 12px;
    }

    body.mini-mode .controls-column {
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }

    body.mini-mode .controls-cluster {
      gap: 5px;
    }

    body.mini-mode .ctrl-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
    }

    body.mini-mode .ctrl-btn svg {
      width: 17px;
      height: 17px;
    }

    body.mini-mode .ctrl-btn.play-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
    }

    body.mini-mode .ctrl-btn.play-btn svg {
      width: 20px;
      height: 20px;
    }

    body.mini-mode .ctrl-btn.stop-btn,
    body.mini-mode .ctrl-btn.drawer-toggle {
      display: none;
    }

    body.mini-mode .volume-bar {
      width: 104px;
      padding: 3px 7px;
      gap: 5px;
    }

    body.mini-mode .volume-pct {
      display: none;
    }

    body.mini-mode .mini-only-actions {
      display: flex;
    }

    .ctrl-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-2px);
    }

    .ctrl-btn:active {
      transform: translateY(0);
    }

    .ctrl-btn.play-btn {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: var(--play-btn-grad);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      box-shadow: 0 6px 20px var(--play-btn-shadow);
    }

    .ctrl-btn.play-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px) scale(1.03);
    }

    .ctrl-btn.stop-btn:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    .ctrl-btn.drawer-toggle.open {
      background: var(--badge-bg);
      border-color: var(--badge-border);
      color: var(--badge-text);
    }

    .ctrl-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .ctrl-btn.play-btn svg {
      width: 28px;
      height: 28px;
    }

    /* Expandable Channel Drawer */
    .channel-drawer {
      position: relative;
      z-index: 3;
      flex: 1;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border-glass);
      background: var(--bg-drawer);
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    .drawer-header {
      padding: 14px 20px 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg {
      position: absolute;
      left: 13px;
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 11px;
      padding: 9px 14px 9px 40px;
      font-size: 14.5px;
      color: var(--text-primary);
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--fav-gold);
      background: rgba(255, 255, 255, 0.11);
    }

    .sync-btn {
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #34d399;
      border-radius: 11px;
      padding: 9px 14px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .sync-btn:hover {
      background: rgba(16, 185, 129, 0.3);
      color: #fff;
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .filter-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-pill:hover {
      background: rgba(255, 255, 255, 0.14);
      color: var(--text-primary);
    }

    .tab-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 3px 10px var(--accent-glow);
    }

    /* Channel List Scroll Area */
    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .channel-list::-webkit-scrollbar {
      width: 7px;
    }

    .channel-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .channel-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .channel-item:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .channel-item.active {
      background: var(--badge-bg);
      border-color: var(--badge-border);
    }

    .ch-item-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }

    .ch-item-swatch {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      color: #fff;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .ch-item-info {
      min-width: 0;
      flex: 1;
    }

    .ch-item-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ch-item-sub {
      font-size: 13px;
      color: var(--text-secondary);
      opacity: 0.85;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ch-item-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-fav-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.25);
      font-size: 21px;
      cursor: pointer;
      padding: 4px 6px;
      transition: all 0.15s ease;
    }

    .item-fav-btn:hover {
      color: var(--fav-gold);
      transform: scale(1.2);
    }

    .item-fav-btn.favorited {
      color: var(--fav-gold);
    }

    /* Footer bar inside drawer */
    .drawer-footer {
      padding: 10px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-secondary);
      background: rgba(0, 0, 0, 0.3);
    }

    .footer-link {
      background: none;
      border: none;
      color: var(--fav-gold);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .footer-link:hover {
      text-decoration: underline;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 15px;
    }

    /* Drag-and-drop favorites styling */
    .drag-handle {
      color: var(--text-muted);
      font-size: 14px;
      letter-spacing: -2px;
      cursor: grab;
      padding: 4px 4px 4px 0;
      opacity: 0.65;
      flex-shrink: 0;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .channel-item:hover .drag-handle {
      opacity: 1;
      color: var(--text-secondary);
    }

    .channel-item.dragging {
      opacity: 0.45;
      border-color: var(--accent);
    }

    .channel-item.drag-over-top {
      box-shadow: 0 -2px 0 0 var(--accent);
    }

    .channel-item.drag-over-bottom {
      box-shadow: 0 2px 0 0 var(--accent);
    }

    .item-delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .item-delete-btn:hover {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    /* Drawer Footer Actions */
    .footer-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .add-stream-trigger {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .add-stream-trigger:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
    }

    /* Inline Add Custom Stream Panel inside Drawer */
    .add-stream-panel {
      display: none;
      flex-direction: column;
      gap: 9px;
      padding: 12px 18px;
      background: rgba(0, 0, 0, 0.32);
      border-bottom: 1px solid var(--border-glass);
    }

    .add-stream-panel.open {
      display: flex;
    }

    .add-stream-title {
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .add-stream-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 8px;
    }

    .add-stream-grid-2 {
      display: grid;
      grid-template-columns: 95px 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .stream-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9px;
      padding: 7px 11px;
      font-size: 13px;
      color: var(--text-primary);
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .stream-input:focus {
      border-color: var(--accent);
      background: var(--bg-card-hover);
    }

    .swatch-picker {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .swatch-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease;
      padding: 0;
    }

    .swatch-dot:hover {
      transform: scale(1.15);
    }

    .swatch-dot.active {
      border-color: #fff;
      transform: scale(1.15);
    }

    .add-stream-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .add-stream-error {
      font-size: 12px;
      color: #fca5a5;
      font-weight: 600;
    }

    .add-stream-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-ghost {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-secondary);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-ghost:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .btn-primary {
      background: var(--play-btn-grad);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 10px var(--play-btn-shadow);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    /* Direct Channel Number Entry HUD */
    .keypad-hud {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      z-index: 70;
      background: rgba(10, 14, 22, 0.94);
      border: 1.5px solid var(--accent);
      border-radius: 16px;
      padding: 10px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75), 0 0 22px var(--accent-glow);
      backdrop-filter: blur(12px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.14s ease, transform 0.14s ease;
    }

    .keypad-hud.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .keypad-num {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .keypad-preview {
      font-size: 13px;
      font-weight: 700;
      color: var(--badge-text);
      max-width: 260px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .keypad-preview.no-match {
      color: var(--text-muted);
    }

    .keypad-hint {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-top: 2px;
    }

    body.mini-mode .keypad-hud {
      flex-direction: row;
      gap: 10px;
      padding: 6px 14px;
      border-radius: 12px;
    }

    body.mini-mode .keypad-num {
      font-size: 17px;
    }

    body.mini-mode .keypad-hint {
      display: none;
    }

    /* Update Available Pill in Top Bar */
    .update-pill {
      display: none;
      align-items: center;
      gap: 4px;
      background: rgba(251, 191, 36, 0.2);
      border: 1px solid rgba(251, 191, 36, 0.55);
      color: #fde68a;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-app-region: no-drag;
    }

    .update-pill.visible {
      display: inline-flex;
    }

    .update-pill:hover {
      background: rgba(251, 191, 36, 0.34);
      border-color: #fbbf24;
      color: #fff;
      transform: translateY(-1px);
    }

    /* Mini Audio Visualizer Canvas */
    .mini-visualizer-canvas {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 2px;
      width: calc(100% - 44px);
      height: 18px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.72;
      transition: opacity 0.25s ease;
    }

    body.mini-mode .mini-visualizer-canvas {
      left: 14px;
      right: 14px;
      bottom: 1px;
      width: calc(100% - 28px);
      height: 9px;
      opacity: 0.65;
    }

    body.visualizer-off .mini-visualizer-canvas {
      opacity: 0;
    }

    /* Track Artist Row + One-Click Track Lookup */
    .track-artist-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      max-width: 100%;
    }

    .track-artist-row .track-artist {
      flex: 1 1 auto;
      width: auto;
    }

    .track-lookup-bar {
      display: none;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .track-lookup-bar.visible {
      display: inline-flex;
    }

    body.mini-mode .track-lookup-bar {
      display: none !important;
    }

    .lookup-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.11);
      color: var(--text-secondary);
      width: 22px;
      height: 20px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all 0.14s ease;
    }

    .lookup-btn svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .lookup-btn:hover {
      transform: translateY(-1px);
      color: #fff;
    }

    .lookup-btn.spotify:hover {
      background: rgba(29, 185, 84, 0.28);
      border-color: rgba(29, 185, 84, 0.65);
      color: #4ade80;
    }

    .lookup-btn.youtube:hover {
      background: rgba(239, 68, 68, 0.28);
      border-color: rgba(239, 68, 68, 0.65);
      color: #fca5a5;
    }

    .lookup-btn.genius:hover {
      background: rgba(251, 191, 36, 0.26);
      border-color: rgba(251, 191, 36, 0.65);
      color: #fde047;
    }

    /* Settings Backup & Update Utility Row */
    .settings-utility-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 2px;
    }

    .utility-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .utility-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-primary);
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .utility-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .settings-feedback {
      font-size: 11px;
      font-weight: 700;
      color: var(--badge-text);
      margin-left: auto;
      white-space: nowrap;
    }

    .settings-feedback.error {
      color: #fca5a5;
    }
  </style>
</head>

    // Direct-radio audio plays in this renderer, so Web Audio can safely measure its
    // real energy for both Christmas lights and the Mini Audio Visualizer.
    // The SiriusXM player runs in a separate isolated BrowserWindow, so the visualizer
    // falls back to a smooth ambient spectrum when SiriusXM is playing.
    let audioContext = null;
    let audioAnalyser = null;
    let audioSamples = null;
    let audioSourceConnected = false;
    let musicFrame = null;
    let energyAverage = 0;
    let lastBeatAt = 0;
    let lastQuietAt = 0;
    let musicHitTimer = null;
    const VIS_BAR_COUNT = 32;
    const visBars = new Float32Array(VIS_BAR_COUNT);

    function clearVisualizerCanvas() {
      const canvas = els.miniVisualizer;
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
      visBars.fill(0);
    }

    function ensureAudioAnalyser() {
      if (!els.directAudio || !els.directAudio.src || els.directAudio.paused) return false;
      try {
        if (!audioContext) audioContext = new AudioContext();
        if (!audioSourceConnected) {
          const source = audioContext.createMediaElementSource(els.directAudio);
          audioAnalyser = audioContext.createAnalyser();
          audioAnalyser.fftSize = 512;
          audioAnalyser.smoothingTimeConstant = 0.72;
          source.connect(audioAnalyser);
          audioAnalyser.connect(audioContext.destination);
          audioSamples = new Uint8Array(audioAnalyser.frequencyBinCount);
          audioSourceConnected = true;
        }
        audioContext.resume().catch(() => {});
        return true;
      } catch (err) {
        return false;
      }
    }

    function stopMusicLightsOnly() {
      if (musicHitTimer) clearTimeout(musicHitTimer);
      musicHitTimer = null;
      energyAverage = 0;
      lastQuietAt = performance.now();
      document.body.style.setProperty('--music-level', '0');
      document.body.classList.remove('music-hit');
      document.body.classList.remove('music-reactive');
    }

    function stopMusicAnalysis() {
      if (musicFrame) cancelAnimationFrame(musicFrame);
      musicFrame = null;
      stopMusicLightsOnly();
      clearVisualizerCanvas();
    }

    function drawMiniVisualizer(now, hasRealAudio) {
      const canvas = els.miniVisualizer;
      if (!canvas || !state.showVisualizer) return;
      const rect = canvas.getBoundingClientRect();
      const targetW = Math.max(60, Math.round(rect.width));
      const targetH = Math.max(8, Math.round(rect.height));
      if (canvas.width !== targetW || canvas.height !== targetH) {
        canvas.width = targetW;
        canvas.height = targetH;
      }
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      ctx.clearRect(0, 0, targetW, targetH);

      const cs = getComputedStyle(document.body);
      const accent = (cs.getPropertyValue('--accent') || '#00d2ff').trim();
      const accent2 = (cs.getPropertyValue('--accent-secondary') || accent).trim();
      const grad = ctx.createLinearGradient(0, targetH, targetW, 0);
      grad.addColorStop(0, accent);
      grad.addColorStop(1, accent2);
      ctx.fillStyle = grad;

      const gap = 3;
      const barW = Math.max(2, (targetW - gap * (VIS_BAR_COUNT - 1)) / VIS_BAR_COUNT);
      const t = now * 0.004;

      for (let i = 0; i < VIS_BAR_COUNT; i++) {
        let targetVal = 0;
        if (hasRealAudio && audioSamples) {
          const binStart = Math.floor(1 + (i / VIS_BAR_COUNT) * (audioSamples.length * 0.45));
          const binEnd = Math.max(binStart + 1, Math.floor(1 + ((i + 1) / VIS_BAR_COUNT) * (audioSamples.length * 0.45)));
          let sum = 0;
          for (let b = binStart; b < binEnd && b < audioSamples.length; b++) {
            sum += audioSamples[b];
          }
          targetVal = (sum / Math.max(1, binEnd - binStart)) / 255;
        } else if (state.isPlaying) {
          // Smooth organic spectrum fallback for isolated SiriusXM audio
          const centerWeight = 1 - Math.abs((i / (VIS_BAR_COUNT - 1)) * 2 - 1) * 0.42;
          const wave =
            0.34 +
            0.24 * Math.sin(t * 1.4 + i * 0.55) +
            0.18 * Math.sin(t * 2.3 - i * 0.85) +
            0.14 * Math.cos(t * 3.1 + i * 1.15);
          targetVal = Math.max(0.08, Math.min(0.92, wave * centerWeight));
        }

        const prev = visBars[i];
        visBars[i] = targetVal > prev ? prev + (targetVal - prev) * 0.42 : prev * 0.86;
        const h = Math.max(2, Math.round(visBars[i] * targetH));
        const x = Math.round(i * (barW + gap));
        const y = targetH - h;
        const r = Math.min(2, barW / 2, h / 2);

        ctx.beginPath();
        ctx.roundRect(x, y, barW, h, [r, r, 0, 0]);
        ctx.fill();
      }
    }

    function startMusicAnalysis() {
      const wantsLights = state.musicReactiveLights && state.theme === 'christmas' && !!(els.directAudio.src && !els.directAudio.paused);
      const wantsVis = state.showVisualizer && state.isPlaying;
      if (!wantsLights && !wantsVis) {
        stopMusicAnalysis();
        return;
      }

      if (els.directAudio.src && !els.directAudio.paused) {
        ensureAudioAnalyser();
      }

      if (musicFrame) return;
      energyAverage = 0;
      lastQuietAt = performance.now();

      const sample = (now) => {
        const directActive = !!(els.directAudio.src && !els.directAudio.paused);
        const lightsActive = state.musicReactiveLights && state.theme === 'christmas' && directActive && !!audioAnalyser;
        const visActive = state.showVisualizer && state.isPlaying;

        if (!lightsActive && !visActive) {
          stopMusicAnalysis();
          return;
        }

        let hasRealSignal = false;
        if (directActive && audioAnalyser && audioSamples) {
          audioAnalyser.getByteFrequencyData(audioSamples);
          for (let i = 1; i < Math.min(48, audioSamples.length); i++) {
            if (audioSamples[i] > 2) {
              hasRealSignal = true;
              break;
            }
          }
        }

        if (lightsActive && hasRealSignal) {
          document.body.classList.add('music-reactive');
          const bins = Math.max(2, Math.floor(audioSamples.length * 0.28));
          let total = 0;
          for (let i = 1; i < bins; i++) total += audioSamples[i];
          const energy = total / ((bins - 1) * 255);
          const baseline = energyAverage || energy;
          const rise = Math.max(0, energy - baseline);
          energyAverage = baseline * 0.92 + energy * 0.08;

          if (energy < 0.045) lastQuietAt = now;
          const level = Math.max(0, Math.min(1, rise / 0.12));
          const isBeat = energy > 0.09 && rise > Math.max(0.025, baseline * 0.24)
            && now - lastQuietAt > 1100 && now - lastBeatAt > 180;
          document.body.style.setProperty('--music-level', level.toFixed(3));
          if (isBeat) {
            lastBeatAt = now;
            document.body.classList.add('music-hit');
            if (musicHitTimer) clearTimeout(musicHitTimer);
            musicHitTimer = setTimeout(() => {
              document.body.classList.remove('music-hit');
              musicHitTimer = null;
            }, 100);
          }
        } else {
          stopMusicLightsOnly();
        }

        if (visActive) {
          drawMiniVisualizer(now, hasRealSignal);
        } else {
          clearVisualizerCanvas();
        }

        musicFrame = requestAnimationFrame(sample);
      };
      musicFrame = requestAnimationFrame(sample);
    }

    function applyVolumeUI() {
      const effectiveVol = state.isMuted ? 0 : state.volume;
      els.volumeSlider.value = String(state.volume);
      els.volumeSlider.style.background = `linear-gradient(to right, var(--accent) 0%, var(--accent) ${effectiveVol}%, var(--badge-bg) ${effectiveVol}%, var(--badge-bg) 100%)`;
      els.volumePct.textContent = state.isMuted ? 'MUTE' : `${state.volume}%`;
      els.muteBtn.classList.toggle('muted', state.isMuted || state.volume === 0);

      if (state.isMuted || state.volume === 0) {
        els.muteIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
      } else if (state.volume < 50) {
        els.muteIcon.innerHTML = '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>';
      } else {
        els.muteIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
      }

      if (els.directAudio) {
        els.directAudio.volume = Math.max(0, Math.min(1, state.volume / 100));
        els.directAudio.muted = !!state.isMuted;
      }
    }

    let volumeIpcTimer = null;
    function updateVolume(newVol, newMuted, immediate = false) {
      state.volume = Math.max(0, Math.min(100, Math.round(newVol)));
      state.isMuted = !!newMuted;
      applyVolumeUI();
      if (volumeIpcTimer) clearTimeout(volumeIpcTimer);
      if (immediate) {
        window.sxmApi.setVolume(state.volume, state.isMuted);
      } else {
        volumeIpcTimer = setTimeout(() => {
          window.sxmApi.setVolume(state.volume, state.isMuted);
        }, 60);
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Car-Radio Style Scrolling Marquee for Overflowing Titles
    const MARQUEE_SPEED_PX_PER_SEC = 28;
    const MARQUEE_PAUSE_SEC = 4.2;
    const MARQUEE_HOVER_PAUSE_SEC = 0.5;
    const MARQUEE_GAP_PX = 48;

    function stopMarquee(el) {
      if (!el) return;
      if (el._marqueeAnim) {
        try { el._marqueeAnim.cancel(); } catch (_) {}
        el._marqueeAnim = null;
      }
      el.classList.remove('is-marquee');
      if (typeof el.dataset.marqueeText === 'string') {
        el.textContent = el.dataset.marqueeText;
      }
    }

    function applyMarquee(el, options = {}) {
      if (!el) return;
      const pauseSec = typeof options.pauseSec === 'number' ? options.pauseSec : MARQUEE_PAUSE_SEC;
      const text = typeof el.dataset.marqueeText === 'string'
        ? el.dataset.marqueeText
        : (el.textContent || '');
      el.dataset.marqueeText = text;
      el.title = text;

      // Reset to plain text first so scrollWidth / clientWidth measure cleanly
      if (el._marqueeAnim) {
        try { el._marqueeAnim.cancel(); } catch (_) {}
        el._marqueeAnim = null;
      }
      el.classList.remove('is-marquee');
      el.textContent = text;

      if (!state.scrollLongTitles || !text || el.clientWidth <= 0) return;

      const overflow = el.scrollWidth - el.clientWidth;
      if (overflow <= 2) return;

      const track = document.createElement('span');
      track.className = 'marquee-track';

      const primary = document.createElement('span');
      primary.className = 'marquee-text';
      primary.textContent = text;

      const gap = document.createElement('span');
      gap.className = 'marquee-gap';
      gap.setAttribute('aria-hidden', 'true');

      const copy = document.createElement('span');
      copy.className = 'marquee-copy';
      copy.setAttribute('aria-hidden', 'true');
      copy.textContent = text;

      track.append(primary, gap, copy);
      el.textContent = '';
      el.appendChild(track);
      el.classList.add('is-marquee');

      const measuredDist = copy.offsetLeft - primary.offsetLeft;
      const distance = measuredDist > 0
        ? measuredDist
        : Math.ceil(primary.getBoundingClientRect().width + MARQUEE_GAP_PX);

      const scrollSec = Math.max(1.5, distance / MARQUEE_SPEED_PX_PER_SEC);
      const totalSec = pauseSec + scrollSec;
      const pauseOffset = Math.min(0.85, pauseSec / totalSec);

      el._marqueeAnim = track.animate(
        [
          { transform: 'translate3d(0, 0, 0)', offset: 0 },
          { transform: 'translate3d(0, 0, 0)', offset: pauseOffset },
          { transform: `translate3d(-${distance}px, 0, 0)`, offset: 1 }
        ],
        {
          duration: totalSec * 1000,
          iterations: Infinity,
          easing: 'linear'
        }
      );
    }

    function setMarqueeText(el, text, force = false) {
      if (!el) return;
      const nextText = String(text ?? '');
      if (!force && el.dataset.marqueeText === nextText) return;
      el.dataset.marqueeText = nextText;
      applyMarquee(el);
    }

    let marqueeRefreshRaf = null;
    function refreshNowPlayingMarquees() {
      if (marqueeRefreshRaf) cancelAnimationFrame(marqueeRefreshRaf);
      marqueeRefreshRaf = requestAnimationFrame(() => {
        marqueeRefreshRaf = null;
        applyMarquee(els.chName);
        applyMarquee(els.trackTitle);
        applyMarquee(els.trackArtist);
      });
    }

    function formatRelativeTime(ts) {
      if (!ts) return '';
      const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      if (diffSec < 60) return 'now';
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m ago`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}h ago`;
      return `${Math.floor(diffHr / 24)}d ago`;
    }

    function isLookupableTrack(title) {
      const clean = String(title || '').trim().toLowerCase();
      if (!clean) return false;
      const ignored = ['ready to stream', 'stream stopped', 'loading...', 'siriusxm', 'reconnecting...'];
      return !ignored.includes(clean);
    }

    function openTrackLookup(service, title, artist) {
      if (!isLookupableTrack(title)) return;
      const query = [artist, title].filter(Boolean).join(' ').trim();
      if (!query) return;
      const encoded = encodeURIComponent(query);
      let url = '';
      if (service === 'spotify') {
        url = `https://open.spotify.com/search/${encoded}`;
      } else if (service === 'youtube') {
        url = `https://www.youtube.com/results?search_query=${encoded}`;
      } else if (service === 'genius') {
        url = `https://genius.com/search?q=${encoded}`;
      }
      if (url) window.sxmApi.openExternalUrl(url);
    }

    function updateNowPlayingLookupVisibility() {
      if (!els.nowPlayingLookup) return;
      els.nowPlayingLookup.classList.toggle('visible', isLookupableTrack(state.currentTrackTitle));
    }

    function renderTrackHistory() {
      const items = state.trackHistory || [];
      els.historyTitle.textContent = `Recent Tracks (${items.length}/12)`;
      if (items.length === 0) {

              <button class="lookup-btn spotify history-lookup-btn" data-service="spotify" data-idx="${idx}" title="Search on Spotify"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm4.58 14.42a.75.75 0 0 1-1.03.25c-2.82-1.72-6.37-2.11-10.55-1.15a.75.75 0 1 1-.33-1.46c4.57-1.05 8.5-.6 11.66 1.33a.75.75 0 0 1 .25 1.03zm1.22-2.72a.94.94 0 0 1-1.29.31c-3.23-1.98-8.15-2.56-11.97-1.4a.94.94 0 1 1-.55-1.8c4.37-1.33 9.79-.68 13.5 1.6a.94.94 0 0 1 .31 1.29zm.11-2.83C14.04 8.57 7.64 8.36 3.94 9.48a1.12 1.12 0 1 1-.65-2.15c4.25-1.29 11.31-1.04 15.77 1.61a1.12 1.12 0 1 1-1.15 1.93z"/></svg></button>

    // Direct Stream Playback (MP3/AAC/OGG + HLS .m3u8 via hls.js) & Auto-Reconnect Watchdog
    let hlsInstance = null;
    let reconnectTimer = null;
    let reconnectAttempts = 0;
    let activeDirectChannel = null;
    let lastDirectProgressAt = 0;
    let lastDirectAudioTime = -1;
    const RECONNECT_DELAYS_MS = [2000, 4000, 8000, 15000, 30000];

    function clearDirectReconnect() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      reconnectAttempts = 0;
    }

    function destroyHlsInstance() {
      if (hlsInstance) {
        try { hlsInstance.destroy(); } catch (_) {}
        hlsInstance = null;
      }
    }

    function scheduleDirectReconnect(reason) {
      if (!state.isPlaying || !activeDirectChannel || !activeDirectChannel.isDirectStream) return;
      if (reconnectTimer) return;
      if (reconnectAttempts >= RECONNECT_DELAYS_MS.length) {
        els.statusText.textContent = 'STREAM OFFLINE — CLICK ● LIVE';
        return;
      }
      const delay = RECONNECT_DELAYS_MS[reconnectAttempts];
      reconnectAttempts += 1;
      els.statusText.textContent = `↻ RECONNECTING (${reconnectAttempts}/${RECONNECT_DELAYS_MS.length})...`;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        if (!state.isPlaying || !activeDirectChannel || !activeDirectChannel.isDirectStream) return;
        playOrStopDirectStream(activeDirectChannel, true, true);
      }, delay);
    }

    function playOrStopDirectStream(ch, shouldPlay, isReconnect = false) {
      if (!els.directAudio) return;
      if (!isReconnect) clearDirectReconnect();

      if (!ch || !ch.isDirectStream || !shouldPlay) {
        activeDirectChannel = null;
        destroyHlsInstance();
        els.directAudio.pause();
        els.directAudio.removeAttribute('src');
        els.directAudio.load();
        if (!state.isPlaying) stopMusicAnalysis();
        return;
      }

      activeDirectChannel = ch;
      lastDirectProgressAt = Date.now();
      lastDirectAudioTime = -1;

      const streamUrl = ch.streamUrl;
      const useHls = (ch.isHls || /\.m3u8(\?|$)/i.test(streamUrl)) && typeof window.Hls !== 'undefined' && window.Hls.isSupported();

      destroyHlsInstance();

      if (useHls) {
        els.directAudio.removeAttribute('src');
        hlsInstance = new window.Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(els.directAudio);
        hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, () => {
          els.directAudio.play().then(startMusicAnalysis).catch(() => {});
        });
        hlsInstance.on(window.Hls.Events.ERROR, (_ev, data) => {
          if (data && data.fatal) {
            scheduleDirectReconnect('hls_fatal');
          }
        });
      } else {
        if (isReconnect || els.directAudio.src !== streamUrl) {
          els.directAudio.src = streamUrl;
          els.directAudio.load();
        }
        els.directAudio.play().then(startMusicAnalysis).catch(err => {
          console.warn('Direct stream play error:', err);
          scheduleDirectReconnect('play_error');
        });
      }
    }

    // Watchdog listeners for direct streams
    els.directAudio.addEventListener('playing', () => {
      if (reconnectAttempts > 0) {
        els.statusText.textContent = getHeaderTitle(true);
      }
      clearDirectReconnect();
      lastDirectProgressAt = Date.now();
      startMusicAnalysis();
    });

    els.directAudio.addEventListener('timeupdate', () => {
      const ct = els.directAudio.currentTime;
      if (ct !== lastDirectAudioTime) {
        lastDirectAudioTime = ct;
        lastDirectProgressAt = Date.now();
      }
    });

    els.directAudio.addEventListener('error', () => {
      if (state.isPlaying && activeDirectChannel) {
        scheduleDirectReconnect('audio_error');
      }
    });

    els.directAudio.addEventListener('ended', () => {
      if (state.isPlaying && activeDirectChannel) {
        scheduleDirectReconnect('audio_ended');
      }
    });

    setInterval(() => {
      if (!state.isPlaying || !activeDirectChannel || !activeDirectChannel.isDirectStream) return;
      if (reconnectTimer) return;
      const stalledForMs = Date.now() - lastDirectProgressAt;
      if (stalledForMs > 12000 && (els.directAudio.readyState < 3 || els.directAudio.paused)) {
        scheduleDirectReconnect('stalled');
      }
    }, 5000);

    // Subtle Snowfall Animation for Christmas & Blizzard Themes
    function initSnowfall() {
      const canvas = els.snowCanvas;
      const ctx = canvas.getContext('2d');
      let flakes = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const leafColors = [
        'rgba(234, 88, 12, 0.55)',
        'rgba(220, 38, 38, 0.5)',
        'rgba(245, 158, 11, 0.55)',
        'rgba(217, 119, 6, 0.5)'
      ];

      for (let i = 0; i < 42; i++) {
        flakes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 2.2 + 0.8,
          speedY: Math.random() * 0.65 + 0.25,
          speedX: (Math.random() - 0.5) * 0.35,
          alpha: Math.random() * 0.45 + 0.15,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.025,
          leafColor: leafColors[i % leafColors.length]
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (state.theme === 'christmas' || state.theme === 'blizzard') {
          for (const f of flakes) {
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${f.alpha})`;
            ctx.fill();
            f.y += f.speedY;
            f.x += f.speedX;
            if (f.y > canvas.height) {
              f.y = -4;
              f.x = Math.random() * canvas.width;
            }
            if (f.x > canvas.width) f.x = 0;
            if (f.x < 0) f.x = canvas.width;
          }
        } else if (state.theme === 'thanksgiving' || state.theme === 'pumpkin' || state.theme === 'autumn') {
          // Drifting Autumn Leaves animation!
          for (const f of flakes) {
            ctx.save();
            ctx.translate(f.x, f.y);
            ctx.rotate(f.angle);
            ctx.beginPath();
            ctx.ellipse(0, 0, f.r * 2.2, f.r * 1.1, 0, 0, Math.PI * 2);
            ctx.fillStyle = f.leafColor;
            ctx.fill();
            ctx.restore();

            f.y += f.speedY * 0.75;
            f.x += Math.sin(f.y * 0.025) * 0.45 + f.speedX;
            f.angle += f.spin;
            if (f.y > canvas.height + 8) {
              f.y = -8;
              f.x = Math.random() * canvas.width;
            }
            if (f.x > canvas.width + 8) f.x = -4;
            if (f.x < -8) f.x = canvas.width + 4;
          }
        } else if (state.theme === 'nyquil') {
          // Rising liquid-gel bubbles for NyQuil theme!
          for (const f of flakes) {
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r * 1.35, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(52, 211, 153, ${f.alpha * 0.65})`;
            ctx.fill();
            f.y -= f.speedY * 0.65;
            f.x += Math.sin(f.y * 0.03) * 0.25;
            if (f.y < -6) {
              f.y = canvas.height + 4;
              f.x = Math.random() * canvas.width;
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    }

    function getHeaderTitle(playing) {
      if (!playing) return '';
      if (state.theme === 'christmas' || state.theme === 'blizzard') return '🎄 LIVE STREAMING';
      if (state.theme === 'thanksgiving') return '🦃 LIVE STREAMING';
      if (state.theme === 'pumpkin' || state.theme === 'autumn') return '🍂 LIVE STREAMING';
      if (state.theme === 'nyquil') return '🧪 LIVE STREAMING';
      if (state.theme === 'adaptive') return '🌈 LIVE STREAMING';
      return 'LIVE STREAMING';
    }

    const ADAPTIVE_VARS = [
      '--bg-shell', '--bg-drawer', '--bg-card', '--bg-card-hover', '--border-glass',
      '--accent', '--accent-secondary', '--accent-glow', '--play-btn-grad',
      '--play-btn-shadow', '--badge-bg', '--badge-border', '--badge-text'
    ];

    function hexToRgb(hex) {
      const m = String(hex || '').trim().match(/^#?([0-9a-f]{6})$/i);
      if (!m) return { r: 0, g: 210, b: 255 };
      const n = parseInt(m[1], 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }

    function clearAdaptiveInlineVars() {
      for (const v of ADAPTIVE_VARS) {
        document.body.style.removeProperty(v);
      }
    }

    function applyAdaptivePalette(rgb) {
      if (state.theme !== 'adaptive') return;
      const c = (rgb && typeof rgb.r === 'number')
        ? rgb
        : hexToRgb(state.currentChannel && state.currentChannel.color);

      const r = Math.max(0, Math.min(255, Math.round(c.r)));
      const g = Math.max(0, Math.min(255, Math.round(c.g)));
      const b = Math.max(0, Math.min(255, Math.round(c.b)));

      const shellR1 = Math.round(12 + r * 0.16);
      const shellG1 = Math.round(14 + g * 0.16);
      const shellB1 = Math.round(18 + b * 0.16);
      const shellR2 = Math.round(7 + r * 0.08);
      const shellG2 = Math.round(9 + g * 0.08);
      const shellB2 = Math.round(13 + b * 0.08);

      const deepR = Math.round(r * 0.62);
      const deepG = Math.round(g * 0.62);
      const deepB = Math.round(b * 0.62);
      const lightR = Math.min(255, Math.round(r + (255 - r) * 0.45));
      const lightG = Math.min(255, Math.round(g + (255 - g) * 0.45));
      const lightB = Math.min(255, Math.round(b + (255 - b) * 0.45));

      const s = document.body.style;
      s.setProperty('--bg-shell', `linear-gradient(145deg, rgba(${shellR1}, ${shellG1}, ${shellB1}, 0.97) 0%, rgba(${shellR2}, ${shellG2}, ${shellB2}, 0.99) 100%)`);
      s.setProperty('--bg-drawer', `rgba(${shellR2}, ${shellG2}, ${shellB2}, 0.98)`);
      s.setProperty('--bg-card', `rgba(${r}, ${g}, ${b}, 0.09)`);
      s.setProperty('--bg-card-hover', `rgba(${r}, ${g}, ${b}, 0.18)`);
      s.setProperty('--border-glass', `rgba(${r}, ${g}, ${b}, 0.42)`);
      s.setProperty('--accent', `rgb(${r}, ${g}, ${b})`);
      s.setProperty('--accent-secondary', `rgb(${deepR}, ${deepG}, ${deepB})`);
      s.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.48)`);
      s.setProperty('--play-btn-grad', `linear-gradient(135deg, rgb(${r}, ${g}, ${b}) 0%, rgb(${deepR}, ${deepG}, ${deepB}) 100%)`);
      s.setProperty('--play-btn-shadow', `rgba(${r}, ${g}, ${b}, 0.48)`);
      s.setProperty('--badge-bg', `rgba(${r}, ${g}, ${b}, 0.2)`);
      s.setProperty('--badge-border', `rgba(${r}, ${g}, ${b}, 0.46)`);
      s.setProperty('--badge-text', `rgb(${lightR}, ${lightG}, ${lightB})`);

      els.ambientGlow.style.background = `radial-gradient(circle, rgba(${r}, ${g}, ${b}, 0.45) 0%, transparent 70%)`;
      applyVolumeUI();
    }

    function applyTheme(themeId) {
      state.theme = themeId || 'christmas';
      document.body.setAttribute('data-theme', state.theme);
      document.querySelectorAll('.theme-chip').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === state.theme);
      });
      if (state.theme === 'adaptive') {
        applyAdaptivePalette(state.lastAdaptiveColor);
      } else {
        clearAdaptiveInlineVars();
      }
      els.statusText.textContent = getHeaderTitle(state.isPlaying);
      if (state.isPlaying) startMusicAnalysis();
      else stopMusicAnalysis();
    }

    els.themeOptions.addEventListener('click', async (e) => {

    let settingsFeedbackTimer = null;
    function setSettingsFeedback(msg, isError = false, autoResetMs = 3500) {
      if (!els.settingsFeedback) return;
      if (settingsFeedbackTimer) clearTimeout(settingsFeedbackTimer);
      els.settingsFeedback.textContent = msg;
      els.settingsFeedback.classList.toggle('error', !!isError);
      if (autoResetMs > 0) {
        settingsFeedbackTimer = setTimeout(() => {
          els.settingsFeedback.classList.remove('error');
          els.settingsFeedback.textContent = state.updateInfo && state.updateInfo.available
            ? `v${state.appVersion} • ⬆ v${state.updateInfo.latestVersion}`
            : `v${state.appVersion}`;
        }, autoResetMs);
      }
    }

    function applyUpdateInfo(info) {
      if (!info) return;
      state.updateInfo = info;
      if (info.available && info.latestVersion) {
        els.updateBadgeBtn.textContent = `⬆ v${info.latestVersion}`;
        els.updateBadgeBtn.title = `Update available: v${info.latestVersion} (click to open Releases)`;
        els.updateBadgeBtn.classList.add('visible');
        if (els.settingsFeedback) {
          els.settingsFeedback.textContent = `v${state.appVersion} • ⬆ v${info.latestVersion}`;
        }
      } else {
        els.updateBadgeBtn.classList.remove('visible');
      }
    }

    function applyFullState(init) {
      if (!init) return;
      state.channels = init.channels || [];
      state.favorites = init.favorites || [];
      state.currentChannel = init.current_channel || state.channels[0];
      state.opacity = typeof init.widget_opacity === 'number' ? init.widget_opacity : 1;
      state.musicReactiveLights = init.music_reactive_lights !== false;
      state.scrollLongTitles = init.scroll_long_titles !== false;
      state.showVisualizer = !!init.show_visualizer;
      state.volume = typeof init.volume === 'number' ? init.volume : 100;
      state.isMuted = !!init.is_muted;
      state.trackHistory = Array.isArray(init.track_history) ? init.track_history : [];
      state.appVersion = init.app_version || state.appVersion || '1.1.0';
      renderVisualSettings();
      applyTheme(init.theme || 'christmas');
      applyVolumeUI();
      applyMiniModeUI(!!init.mini_mode);
      applyWidgetScaleUI(typeof init.widget_scale === 'number' ? init.widget_scale : 1);
      applyStartupToggleUI(!!init.launch_at_startup);
      updateCurrentChannelUI(state.currentChannel);
      renderTrackHistory();
      refreshNowPlayingMarquees();
      if (init.update_info) {
        applyUpdateInfo(init.update_info);
      } else if (els.settingsFeedback) {
        els.settingsFeedback.textContent = `v${state.appVersion}`;
      }
    }

    els.exportSettingsBtn.addEventListener('click', async () => {
      const res = await window.sxmApi.exportSettings();
      if (res && res.ok) {
        setSettingsFeedback('✓ Backup exported!', false);

        setSettingsFeedback(res.error || 'Export failed', true);

      const res = await window.sxmApi.importSettings();
      if (res && res.ok && res.state) {
        applyFullState(res.state);
        setSettingsFeedback('✓ Backup restored!', false);

        setSettingsFeedback(res.error || 'Import failed', true);

          setSettingsFeedback(`✓ Up to date (v${info.currentVersion})`, false, 4000);

        setSettingsFeedback('Could not check updates', true, 3500);

      e.stopPropagation();

    function updateCurrentChannelUI(ch) {
      if (!ch) return;
      state.currentChannel = ch;
      const badgeLabel = ch.isDirectStream ? `📻 ${ch.number}` : `CH ${ch.number}`;
      const badgeChanged = els.chBadge.textContent !== badgeLabel;
      els.chBadge.textContent = badgeLabel;

      setMarqueeText(els.chName, ch.name, badgeChanged);

      els.ambientGlow.style.background = `radial-gradient(circle, ${color}55 0%, transparent 70%)`;

        applyAdaptivePalette(hexToRgb(color));
