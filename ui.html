    function renderChannelList() {
      const q = state.searchQuery.trim().toLowerCase();
      const isFavReorderMode = state.activeFilter === 'favorites' && !q;

      let filtered = state.channels.filter(ch => {
        if (state.activeFilter === 'favorites' && !state.favorites.includes(String(ch.number))) {
          return false;
        }
        if (state.activeFilter === 'all' && !q && ch.isDirectStream) {
          // Keep "All SXM (826)" dedicated to SiriusXM channels unless searching or in Free Holiday Radio / Custom / Favorites
          return false;
        }
        if (state.activeFilter === 'Custom') {
          if (!ch.isUserCustom && (ch.genre || '').toLowerCase() !== 'custom') {
            return false;
          }
        } else if (state.activeFilter !== 'all' && state.activeFilter !== 'favorites') {
          if ((ch.genre || '').toLowerCase() !== state.activeFilter.toLowerCase()) {
            return false;
          }
        }
        if (q) {
          const matchName = ch.name.toLowerCase().includes(q);
          const matchNum = String(ch.number).toLowerCase().includes(q);
          const matchGenre = (ch.genre || '').toLowerCase().includes(q);
          const matchDesc = (ch.desc || '').toLowerCase().includes(q);
          return matchName || matchNum || matchGenre || matchDesc;
        }
        return true;
      });

      if (state.activeFilter === 'favorites') {
        filtered.sort((a, b) => state.favorites.indexOf(String(a.number)) - state.favorites.indexOf(String(b.number)));
      }

      els.channelCountLabel.textContent = `${filtered.length} Channel${filtered.length === 1 ? '' : 's'}`;

      if (filtered.length === 0) {
        const emptyMsg = state.activeFilter === 'Custom'
          ? 'No custom streams yet. Click "+ Add Stream" below to add one!'
          : 'No channels match your filter.';
        els.channelList.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
        return;
      }

      els.channelList.innerHTML = filtered.map(ch => {
        const isFav = state.favorites.includes(String(ch.number));
        const isActive = state.currentChannel && String(state.currentChannel.number) === String(ch.number);
        const color = ch.color || '#00d2ff';
        const prefix = ch.isUserCustom ? `Custom Stream` : (ch.isDirectStream ? `Free Stream` : `Ch ${ch.number}`);
        const subText = ch.desc ? `${prefix} • ${ch.desc}` : `${prefix} • ${ch.genre || 'SiriusXM'}`;
        const dragHandle = isFavReorderMode ? `<span class="drag-handle" title="Drag to reorder">⋮⋮</span>` : '';
        const deleteBtn = ch.isUserCustom
          ? `<button class="item-delete-btn" data-delete="${escapeHtml(ch.number)}" title="Remove Custom Stream">✕</button>`
          : '';
        return `
          <div class="channel-item ${isActive ? 'active' : ''}" data-number="${escapeHtml(ch.number)}" ${isFavReorderMode ? 'draggable="true"' : ''}>
            <div class="ch-item-left">
              ${dragHandle}
              <div class="ch-item-swatch" style="background: ${color}">${escapeHtml(ch.number)}</div>
              <div class="ch-item-info">
                <div class="ch-item-title marquee-host">${escapeHtml(ch.name)}</div>
                <div class="ch-item-sub marquee-host">${escapeHtml(subText)}</div>
              </div>
            </div>
            <div class="ch-item-right">
              ${deleteBtn}
              <button class="item-fav-btn ${isFav ? 'favorited' : ''}" data-fav="${escapeHtml(ch.number)}" title="Toggle Favorite">★</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Drag-and-Drop Reordering for Favorites Tab
    let draggedFavNum = null;

    function clearDragIndicators() {
      els.channelList.querySelectorAll('.channel-item').forEach(el => {
        el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
      });
    }

    els.channelList.addEventListener('dragstart', (e) => {
      if (state.activeFilter !== 'favorites' || state.searchQuery.trim()) return;
      const item = e.target.closest('.channel-item');
      if (!item) return;
      draggedFavNum = String(item.dataset.number);
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggedFavNum);
    });

    els.channelList.addEventListener('dragover', (e) => {
      if (!draggedFavNum || state.activeFilter !== 'favorites') return;
      const item = e.target.closest('.channel-item');
      if (!item || String(item.dataset.number) === draggedFavNum) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      clearDragIndicators();
      const draggedEl = els.channelList.querySelector(`.channel-item[data-number="${CSS.escape(draggedFavNum)}"]`);
      if (draggedEl) draggedEl.classList.add('dragging');
      const rect = item.getBoundingClientRect();
      const isBottom = (e.clientY - rect.top) > rect.height / 2;
      item.classList.add(isBottom ? 'drag-over-bottom' : 'drag-over-top');
    });

    els.channelList.addEventListener('dragleave', (e) => {
      const item = e.target.closest('.channel-item');
      if (item) {
        item.classList.remove('drag-over-top', 'drag-over-bottom');
      }
    });

    els.channelList.addEventListener('drop', async (e) => {
      if (!draggedFavNum || state.activeFilter !== 'favorites') return;
      e.preventDefault();
      const targetItem = e.target.closest('.channel-item');
      const sourceNum = draggedFavNum;
      draggedFavNum = null;
      if (!targetItem) {
        clearDragIndicators();
        return;
      }
      const targetNum = String(targetItem.dataset.number);
      if (sourceNum === targetNum) {
        clearDragIndicators();
        return;
      }
      const rect = targetItem.getBoundingClientRect();
      const insertAfter = (e.clientY - rect.top) > rect.height / 2;

      const updated = state.favorites.filter(f => String(f) !== sourceNum);
      let targetIdx = updated.indexOf(targetNum);
      if (targetIdx < 0) {
        updated.push(sourceNum);
      } else {
        if (insertAfter) targetIdx += 1;
        updated.splice(targetIdx, 0, sourceNum);
      }

      clearDragIndicators();
      state.favorites = await window.sxmApi.reorderFavorites(updated);
      renderChannelList();
    });

    els.channelList.addEventListener('dragend', () => {
      draggedFavNum = null;
      clearDragIndicators();
    });

          renderChannelList();

      const favBtn = e.target.closest('.item-fav-btn');

    async function handleSaveCustomStream() {
      els.customStreamError.textContent = '';
      const origLabel = els.saveAddStreamBtn.textContent;
      els.saveAddStreamBtn.disabled = true;
      els.saveAddStreamBtn.textContent = 'Resolving...';
      let res = null;
      try {
        res = await window.sxmApi.addCustomStream({
          name: els.customStreamName.value,
          streamUrl: els.customStreamUrl.value,
          number: els.customStreamNum.value,
          genre: els.customStreamGenre.value,
          color: selectedCustomColor
        });
      } finally {
        els.saveAddStreamBtn.disabled = false;
        els.saveAddStreamBtn.textContent = origLabel;

      if (!res || !res.ok) {
        els.customStreamError.textContent = (res && res.error) || 'Could not add stream.';
        return;
      }

      state.channels = res.channels;
      els.customStreamName.value = '';
      els.customStreamUrl.value = '';
      els.customStreamNum.value = '';
      els.customStreamGenre.value = '';
      openAddStreamPanel(false);

      document.querySelectorAll('.tab-pill').forEach(b => {

        state.isPlaying = playRes.is_playing;
        playOrStopDirectStream(playRes.channel, state.isPlaying);
        updatePlayIcon(state.isPlaying);

    // Direct Channel Number Entry (Car-Radio Style Keypad HUD)
    let keypadBuffer = '';
    let keypadTimer = null;

    function findChannelByEntry(buf) {
      const upper = buf.toUpperCase();
      return state.channels.find(c => String(c.number).toUpperCase() === upper) || null;
    }

    function hideKeypadHud() {
      keypadBuffer = '';
      if (keypadTimer) {
        clearTimeout(keypadTimer);
        keypadTimer = null;
      }
      els.keypadHud.classList.remove('visible');
    }

    function updateKeypadHud() {
      if (!keypadBuffer) {
        hideKeypadHud();
        return;
      }
      const match = findChannelByEntry(keypadBuffer);
      els.keypadNum.textContent = `CH ${keypadBuffer}`;
      if (match) {
        els.keypadPreview.textContent = match.name;
        els.keypadPreview.classList.remove('no-match');
      } else {
        els.keypadPreview.textContent = 'No matching channel';
        els.keypadPreview.classList.add('no-match');
      }
      els.keypadHud.classList.add('visible');

      if (keypadTimer) clearTimeout(keypadTimer);
      keypadTimer = setTimeout(hideKeypadHud, 2500);
    }

    document.addEventListener('keydown', async (e) => {
      const tag = (e.target && e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || e.ctrlKey || e.altKey || e.metaKey) return;

      if (/^[0-9]$/.test(e.key) || (keypadBuffer.length === 0 && /^[wc]$/i.test(e.key))) {
        if (keypadBuffer.length < 4) {
          keypadBuffer += e.key.toUpperCase();
          updateKeypadHud();
        }
        return;
      }

      if (keypadBuffer.length > 0) {
        if (e.key === 'Backspace') {
          e.preventDefault();
          keypadBuffer = keypadBuffer.slice(0, -1);
          updateKeypadHud();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          hideKeypadHud();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const match = findChannelByEntry(keypadBuffer);
          hideKeypadHud();
          if (match) {
            const res = await window.sxmApi.selectChannel(String(match.number));
            if (res && res.channel) {
              updateCurrentChannelUI(res.channel);
              state.isPlaying = res.is_playing;
              playOrStopDirectStream(res.channel, state.isPlaying);
              updatePlayIcon(state.isPlaying);
            }
          }
        }
      }
    });

      }
      if (meta.artist) {
        state.currentTrackArtist = meta.artist;
        setMarqueeText(els.trackArtist, meta.artist);
      } else if (meta.title && meta.artist === '') {
        state.currentTrackArtist = '';
      }
      updateNowPlayingLookupVisibility();
      if (typeof meta.is_playing === 'boolean') {
        state.isPlaying = meta.is_playing;
        updatePlayIcon(state.isPlaying);
      }
      if (meta.watchdog_notice) {
        els.statusText.textContent = `↻ ${meta.watchdog_notice}`;
        setTimeout(() => {
          if (state.isPlaying) els.statusText.textContent = getHeaderTitle(true);
        }, 2400);
      }
      if (meta.artwork) {
        els.artImage.src = meta.artwork;
        els.artImage.style.display = 'block';
        els.artFallback.style.display = 'none';
      } else {
        els.artImage.style.display = 'none';
        els.artFallback.style.display = 'flex';
      }
      if (meta.adaptive_color && typeof meta.adaptive_color.r === 'number') {
        state.lastAdaptiveColor = meta.adaptive_color;
        if (state.theme === 'adaptive') {
          applyAdaptivePalette(meta.adaptive_color);
        }
      } else if (!meta.artwork) {
        state.lastAdaptiveColor = null;
        if (state.theme === 'adaptive') {
          applyAdaptivePalette(null);
        }
      }
      if (meta.auth_needed) {
        els.statusDot.className = 'status-dot auth-needed';
        els.statusText.textContent = 'SIGN IN REQUIRED (🌐)';
      }
    });

    // Track History updates from Electron main process
    window.sxmApi.onHistoryUpdate((history) => {
      state.trackHistory = Array.isArray(history) ? history : [];
      if (els.historyPopover.classList.contains('open')) {
        renderTrackHistory();
      }
    });

    // Update Notifier from Electron main process
    window.sxmApi.onUpdateAvailable((info) => {
      applyUpdateInfo(info);
    });

    // Initialize on load
    window.addEventListener('DOMContentLoaded', async () => {
      initSnowfall();
      const init = await window.sxmApi.getInitialState();
      applyFullState(init);

      const nowPlayingEl = document.querySelector('.now-playing');
      if (nowPlayingEl && typeof ResizeObserver !== 'undefined') {
        let lastNowPlayingWidth = Math.round(nowPlayingEl.clientWidth);
        const ro = new ResizeObserver(() => {
          const nextWidth = Math.round(nowPlayingEl.clientWidth);
          if (Math.abs(nextWidth - lastNowPlayingWidth) > 1) {
            lastNowPlayingWidth = nextWidth;
            refreshNowPlayingMarquees();
          }
        });
        ro.observe(nowPlayingEl);
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => refreshNowPlayingMarquees());
      }
      window.addEventListener('resize', refreshNowPlayingMarquees);
    });
  </script>
</body>
</html>
